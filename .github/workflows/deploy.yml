# Deploys the Elfin Group site (site/) to the Vercel project "elfingroup".
#   push to main         -> production  (https://elfingroup.vercel.app)
#   pull request         -> preview URL (shown in the run summary)
#   manual run           -> production
# Needs one repository secret, VERCEL_TOKEN (vercel.com/account/tokens). Until it exists the
# deploy job is skipped (not failed); the site is then deployed manually with the Vercel CLI.
name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "site/**"
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Identifiers, not credentials: useless without the token.
  VERCEL_ORG_ID: team_d4Tc3qWf0XitBOAMjcFvSkXr
  VERCEL_PROJECT_ID: prj_aJctBAtjJrN8pbOfjDlnXPP6CRdP
  VERCEL_CLI_VERSION: 52.2.1

jobs:
  # Gate: is the token configured? Kept separate so a missing token never opens a
  # (failed) "production" deployment; the deploy job is simply skipped.
  check:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not set, so automatic deploy is skipped. Add it under Settings > Secrets and variables > Actions to enable it."
          fi

  deploy:
    needs: check
    # Runs only with a token; fork PRs never receive secrets, so they are skipped too.
    if: needs.check.outputs.ready == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: site
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # Fail with a readable reason (as an annotation) rather than a bare "exit code 1".
      - name: Verify token
        run: |
          if ! who=$(vercel whoami --token="$VERCEL_TOKEN" 2>&1); then
            echo "$who"
            reason=$(printf '%s' "$who" | grep -iE 'error|invalid|expired|forbidden|denied|not' | head -n 2 | tr '\n' ' ')
            echo "::error title=Vercel rejected VERCEL_TOKEN::${reason:-The token was not accepted.} Create a new token at vercel.com/account/tokens (scope: the team that owns the elfingroup project) and replace the secret, with no spaces or line breaks."
            exit 1
          fi
          echo "::notice title=Vercel token OK::Authenticated as $(printf '%s' "$who" | tail -n 1)"

      - name: Pull project settings
        run: |
          if ! out=$(vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN" 2>&1); then
            echo "$out"
            reason=$(printf '%s' "$out" | grep -iE 'error|not found|scope|team|forbidden|denied|access' | head -n 3 | tr '\n' ' ')
            echo "::error title=vercel pull failed::${reason:-See the step log.} If this mentions scope or access, the token was created for a different team than the one owning the elfingroup project."
            exit 1
          fi
          echo "$out"

      - name: Build
        run: |
          if [ "$TARGET" = production ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        run: |
          if [ "$TARGET" = production ]; then
            out=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            out=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          # The CLI prints either a bare URL or a JSON summary; take the first deployment URL.
          url=$(printf '%s\n' "$out" | grep -oE 'https://[A-Za-z0-9.-]+\.vercel\.app' | head -n 1)
          if [ -z "$url" ]; then
            echo "$out"
            echo "::error::Could not find the deployment URL in the Vercel CLI output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to Vercel ($TARGET)"
            echo ""
            echo "- Deployment: $url"
            if [ "$TARGET" = production ]; then echo "- Live: https://elfingroup.vercel.app"; fi
          } >> "$GITHUB_STEP_SUMMARY"
